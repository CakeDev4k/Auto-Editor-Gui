<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Fonte do ícone do PrimeTrim. Gerar os tamanhos com:
       npx tauri icon src-tauri/icons/icon-source.svg -->
  <defs>
    <linearGradient id="onda" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="724">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faixa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="caixa">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
  </defs>

  <g clip-path="url(#caixa)">
    <rect x="64" y="64" width="896" height="896" fill="#0a0a0b"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#brilho)"/>
  </g>
  <rect x="64.5" y="64.5" width="895" height="895" rx="200" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>

  <!-- onda: o que fica -->
  <g stroke="url(#onda)" stroke-width="64" stroke-linecap="round" fill="none">
    <path d="M232 452v120"/>
    <path d="M328 300v424"/>
    <path d="M696 360v304"/>
    <path d="M792 470v84"/>
  </g>

  <!-- o silêncio que sai -->
  <g fill="#ffffff" fill-opacity="0.32">
    <circle cx="436" cy="512" r="22"/>
    <circle cx="512" cy="512" r="22"/>
    <circle cx="588" cy="512" r="22"/>
  </g>

  <!-- marcas do corte -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M424 360v-40h-28"/>
    <path d="M424 664v40h-28"/>
    <path d="M600 360v-40h28"/>
    <path d="M600 664v40h28"/>
  </g>
</svg>
